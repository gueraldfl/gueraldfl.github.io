<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Auna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1436;
  --teal:#0096AD;
  --cyan:#00B0CA;
  --slate:#626D84;
  --muted:#8A93A6;
  --disabled:#A7AFBE;
  --tile:#F5F6FA;
  --line:#E4E7EE;
  --green:#1B8C2E;
  --lime-bg:#F1F6C9;
  --lime-ink:#566300;
  --lime-badge:#E3F09A;
  --purple:#5A1E8C;
  --page:#EEF1F5;
  --surface:#FFFFFF;
  --ease:cubic-bezier(.22,.8,.3,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page);
  color:var(--navy);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:10px}

.app{
  position:relative;
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:0 auto;
  background:var(--surface);
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));
  overflow-x:clip;
}
@media (min-width:480px){
  .app{box-shadow:0 0 0 1px rgba(13,20,54,.05),0 24px 60px rgba(13,20,54,.12)}
}
.pad{padding-inline:7.2%}

/* ---------- Header ---------- */
.header{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  height:62px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.avatar{
  position:absolute;left:4.8%;top:50%;
  width:35px;height:35px;margin-top:-17.5px;
  border-radius:50%;
  transition:transform .2s var(--ease);
}
.avatar:active{transform:scale(.92)}
.avatar svg{width:100%;height:100%}
.logo{width:100px;height:auto}

/* ---------- Typography ---------- */
.hello{margin:30px 0 0;font-size:21px;line-height:1.25;font-weight:600;letter-spacing:-.005em}
.row{display:flex;align-items:baseline;justify-content:space-between}
.h2{margin:0;font-size:17px;line-height:1.3;font-weight:600}
.link{
  font-size:15.5px;font-weight:500;color:var(--teal);
  padding:4px 0 4px 8px;
  transition:opacity .2s, transform .2s var(--ease);
}
.link:active{opacity:.55;transform:translateX(2px)}

/* ---------- Appointment ---------- */
.appt-head{margin-top:32px}
.appt{
  position:relative;
  display:flex;gap:16px;
  margin-top:20px;
  padding:0;
}
.datebox{
  flex:0 0 42px;height:47px;
  border:1px solid var(--disabled);border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin-top:1px;
}
.datebox small{font-size:10.5px;line-height:1.1;font-weight:500;letter-spacing:.01em}
.datebox b{font-size:17px;line-height:1.15;font-weight:600}
.appt-body{flex:1;min-width:0;padding-right:22px}
.chip{
  display:inline-block;
  padding:1px 12px;border-radius:5px;
  background:var(--lime-bg);color:var(--lime-ink);
  font-size:13px;font-weight:500;line-height:1.55;
}
.appt h3{margin:3px 0 0;font-size:18px;line-height:1.3;font-weight:500}
.doctor{margin:1px 0 0;font-size:15.5px;line-height:1.4;color:var(--muted);font-weight:400}
.time{display:flex;align-items:center;gap:6px;margin:1px 0 0;font-size:16px;line-height:1.5}
.time svg{width:15px;height:15px;flex:none}
.paid{display:flex;align-items:center;gap:5px;margin:8px 0 0;font-size:14.5px;font-weight:600;color:var(--green);line-height:1.5}
.paid svg{width:15px;height:15px;flex:none}
.join{
  margin-top:13px;
  height:35px;padding:0 20px;
  border-radius:999px;
  background:var(--teal);color:#fff;
  font-size:15.5px;font-weight:500;
  position:relative;overflow:hidden;
  transition:transform .18s var(--ease),box-shadow .25s,background-color .25s;
  box-shadow:0 4px 12px rgba(0,150,173,.22);
}
.join:hover{background:#00899e}
.join:active{transform:scale(.96);box-shadow:0 1px 4px rgba(0,150,173,.25)}
.join .rip,.cta-rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .55s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.chev{
  position:absolute;right:-6px;top:56px;
  width:32px;height:32px;display:grid;place-items:center;
  transition:transform .22s var(--ease);
}
.chev svg{width:9px;height:15px}
.appt:hover .chev,.chev:active{transform:translateX(3px)}

/* ---------- Accesos ---------- */
.access-head{margin-top:36px}
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  margin-top:20px;
}
.tile{
  position:relative;
  aspect-ratio:197/222;
  border-radius:12px;
  background:var(--tile);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;padding:4px 4px 0;
  overflow:hidden;
  transition:transform .2s var(--ease),box-shadow .25s,background-color .25s;
  text-align:center;
}
.tile .ico{width:31px;height:31px;transition:transform .3s var(--ease)}
.tile .ico svg{width:100%;height:100%}
.tile span.lbl{font-size:12.5px;line-height:1.3;font-weight:400;color:var(--navy);max-width:96%}
.tile:hover{box-shadow:0 8px 20px rgba(13,20,54,.08);background:#F0F2F8}
.tile:hover .ico{transform:translateY(-2px)}
.tile:active{transform:scale(.95)}
.badge{
  position:absolute;top:0;right:0;
  padding:1px 10px 2px 11px;
  font-size:12.5px;line-height:1.5;font-weight:500;
  border-radius:0 12px 0 12px;
}
.badge.lime{background:var(--lime-badge);color:var(--lime-ink)}
.badge.purple{background:var(--purple);color:#fff;padding:1px 12px 2px 13px}

/* ---------- Carousel ---------- */
.disc-head{margin-top:36px}
.carousel{margin-top:19px;overflow:hidden;border-radius:12px;touch-action:pan-y}
.track{display:flex;transition:transform .55s var(--ease);will-change:transform}
.track.drag{transition:none}
.slide{flex:0 0 100%;min-width:0}
.slide svg{width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.cta{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .18s var(--ease),filter .25s}
.cta:hover{filter:drop-shadow(0 3px 6px rgba(0,60,80,.25))}
.cta:active{transform:scale(.95)}
.controls{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:20px}
.arrow{
  width:36px;height:36px;border-radius:50%;
  background:var(--teal);display:grid;place-items:center;
  transition:transform .18s var(--ease),background-color .3s,opacity .3s;
}
.arrow svg{width:9px;height:14px}
.arrow:active:not(:disabled){transform:scale(.9)}
.arrow:disabled{background:var(--disabled);cursor:default}
.dots{display:flex;align-items:center;gap:8px}
.dot{
  width:8px;height:8px;border-radius:999px;background:var(--disabled);
  transition:width .4s var(--ease),background-color .3s;
  padding:0;
}
.dot.on{width:24px;background:var(--teal)}

/* ---------- Liquid Glass nav ---------- */
.nav{
  position:fixed;left:50%;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(calc(100vw - 20px),410px);
  transform:translateX(-50%);
  z-index:50;
  padding:6px;
  border-radius:44px;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.42));
  -webkit-backdrop-filter:blur(16px) saturate(1.7) brightness(1.04);
  backdrop-filter:blur(16px) saturate(1.7) brightness(1.04);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 12px 32px rgba(13,20,54,.14),
    0 2px 6px rgba(13,20,54,.06),
    inset 0 1.5px 1px rgba(255,255,255,.95),
    inset 0 -1px 1px rgba(13,20,54,.05),
    inset 0 0 18px rgba(255,255,255,.35);
  animation:navIn .7s .55s var(--ease) both;
}
.nav::before{ /* specular edge */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    linear-gradient(115deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 22%),
    linear-gradient(295deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 18%);
  mix-blend-mode:soft-light;
  opacity:.9;
}
.nav::after{ /* inner rim */
  content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .nav{background:rgba(255,255,255,.92)}
}
@keyframes navIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.nav-in{position:relative;display:grid;grid-template-columns:repeat(4,1fr);z-index:1}
.pill{
  position:absolute;left:0;top:0;bottom:0;width:25%;
  border-radius:38px;
  background:linear-gradient(180deg,#00A4BD,#0096AD);
  box-shadow:0 6px 14px rgba(0,150,173,.35),inset 0 1px 1px rgba(255,255,255,.45);
  transform:translateX(calc(var(--i,0)*100%));
  transition:transform .5s var(--ease);
}
.pill.move{animation:squish .5s var(--ease)}
@keyframes squish{40%{scale:1.07 .96}100%{scale:1 1}}
.nav-item{
  position:relative;z-index:1;
  height:54px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--slate);
  font-size:11.5px;line-height:1.1;font-weight:500;
  transition:color .35s var(--ease);
}
.nav-item .in{display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .18s var(--ease)}
.nav-item svg{width:24px;height:24px}
.nav-item.on{color:#fff}
.nav-item:active .in{transform:scale(.92)}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,8px);
  max-width:min(calc(100vw - 40px),360px);
  padding:10px 16px;border-radius:14px;
  background:rgba(13,20,54,.92);color:#fff;
  font-size:13px;line-height:1.35;
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .3s var(--ease);
  z-index:60;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Entrance ---------- */
.rv{animation:rv .55s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes rv{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
}
@media (max-width:340px){
  .hello{font-size:19px}.tile .lbl{font-size:11.5px}.nav-item{font-size:10.5px}
}
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  /* ---- Toast (demo feedback) ---- */
  var toast=document.getElementById('toast'),tt;
  function say(msg){
    toast.textContent=msg;toast.classList.add('show');
    clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},1700);
  }
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-toast]');
    if(el)say(el.getAttribute('data-toast'));
  });

  /* ---- Unirme ---- */
  var join=document.getElementById('join');
  join.addEventListener('click',function(e){
    var r=join.getBoundingClientRect(),s=Math.max(r.width,r.height)*2;
    var d=document.createElement('span');d.className='rip';
    d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
    join.appendChild(d);setTimeout(function(){d.remove()},600);
    say('Conectando con tu teleconsulta de Dermatología…');
  });

  /* ---- Carousel ---- */
  var track=document.getElementById('track'),
      car=document.getElementById('carousel'),
      slides=track.children,n=slides.length,
      prev=document.getElementById('prev'),next=document.getElementById('next'),
      dotsEl=document.getElementById('dots'),
      cur=n-1,dots=[];
  for(var i=0;i<n;i++){
    (function(i){
      var b=document.createElement('button');
      b.type='button';b.className='dot';b.setAttribute('role','tab');
      b.setAttribute('aria-label','Diapositiva '+(i+1));
      b.addEventListener('click',function(){go(i)});
      dotsEl.appendChild(b);dots.push(b);
    })(i);
  }
  function render(){
    track.style.transform='translateX('+(-cur*100)+'%)';
    dots.forEach(function(d,i){d.classList.toggle('on',i===cur);d.setAttribute('aria-selected',i===cur)});
    prev.disabled=cur===0;next.disabled=cur===n-1;
    Array.prototype.forEach.call(slides,function(s,i){s.setAttribute('aria-hidden',i!==cur)});
  }
  function go(i){cur=Math.max(0,Math.min(n-1,i));render()}
  prev.addEventListener('click',function(){go(cur-1)});
  next.addEventListener('click',function(){go(cur+1)});
  car.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1)});
  // swipe
  var sx=0,dx=0,drag=false,w=1;
  car.addEventListener('pointerdown',function(e){
    if(e.target.closest('.cta'))return;
    drag=true;sx=e.clientX;dx=0;w=car.clientWidth;track.classList.add('drag');
  });
  window.addEventListener('pointermove',function(e){
    if(!drag)return;dx=e.clientX-sx;
    var edge=(cur===0&&dx>0)||(cur===n-1&&dx<0)?.3:1;
    track.style.transform='translateX('+(-cur*w+dx*edge)+'px)';
  });
  function endDrag(){
    if(!drag)return;drag=false;track.classList.remove('drag');
    if(Math.abs(dx)>w*.18)go(cur+(dx<0?1:-1));else render();
  }
  window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
  document.querySelectorAll('.cta').forEach(function(c){
    c.addEventListener('click',function(){say('Contáctanos')});
    c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();say('Contáctanos')}});
  });
  render();

  /* ---- Bottom nav ---- */
  var navIn=document.getElementById('navIn'),pill=document.getElementById('pill'),
      items=navIn.querySelectorAll('.nav-item');
  items.forEach(function(it,i){
    it.addEventListener('click',function(){
      items.forEach(function(o){o.classList.remove('on');o.removeAttribute('aria-current')});
      it.classList.add('on');it.setAttribute('aria-current','page');
      navIn.style.setProperty('--i',i);
      pill.classList.remove('move');void pill.offsetWidth;pill.classList.add('move');
    });
  });
})();
</script>
